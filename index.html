<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apresentação</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            background: transparent; /* O background agora é a animação lá no HTML */
            overflow: hidden;
        }

        .slide-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        h1 {
            font-size: 55px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
            transition: opacity 0.3s ease;
        }

        p {
            font-size: 28px;
            color: #d1d5db;
            max-width: 800px;
            line-height: 1.4;
            transition: opacity 0.3s ease;
        }

        /* Área dos Botões */
        .botoes-container {
            padding: 25px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border-top: 1px solid #333;
            box-sizing: border-box;
        }

        button {
            background: #2a2a2a;
            color: #eeeeee;
            border: 1px solid #444;
            padding: 14px 22px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            background: #3a3a3a;
            transform: translateY(-3px);
            border-color: #666;
            color: white;
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .slide-container, .botoes-container {
            position: relative;
            z-index: 10;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 15px;
            backdrop-filter: blur(5px);
        }

        .slide-container {
            margin-bottom: auto;
            margin-top: auto;
            width: 80%;
        }

        /* ===== BACKGROUND EM VÍDEO ===== */
        .video-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            object-fit: cover;
            filter: brightness(0.4); /* Escurece o vídeo para o texto ficar bem visível */
        }

        /* ===== RESPONSIVIDADE (Celulares e Tablets) ===== */
        @media screen and (max-width: 768px) {
            h1 {
                font-size: 32px;
                margin-bottom: 15px;
            }
            p {
                font-size: 20px;
                line-height: 1.3;
            }
            .slide-container {
                width: 90%;
                padding: 15px;
            }
            .botoes-container {
                padding: 15px 10px;
                gap: 10px;
                flex-wrap: nowrap;
                overflow-x: auto;
                justify-content: flex-start;
                -webkit-overflow-scrolling: touch;
                scrollbar-width: none; 
            }
            .botoes-container::-webkit-scrollbar {
                display: none;
            }
            button {
                padding: 12px 18px;
                font-size: 16px;
                white-space: nowrap;
                flex-shrink: 0;
            }
        }
    </style>
</head>

<body>

    <!-- Background animado em Vídeo -->
    <video autoplay loop muted playsinline class="video-bg">
        <source src="https://static.vecteezy.com/system/resources/previews/068/240/957/mp4/people-walking-across-a-crosswalk-in-a-city-video.mp4" type="video/mp4">
    </video>

    <div class="slide-container">
        <h1 id="titulo" style="font-size:40px; margin-top:0;">Cidades Inteligentes Arcade</h1>
        
        <div id="game-area" style="width:100%; height:320px; position:relative; overflow:hidden; background:rgba(0,0,0,0.3); border-radius:10px; margin-top:10px; display:flex; flex-direction:column; justify-content:center; align-items:center;">
            <p id="conteudo">Escolha um minigame no menu abaixo para começar a jogar!</p>
        </div>
    </div>

    <!-- Barra de navegação com os botões dos jogos -->
    <div class="botoes-container">
        <button onclick="window.location.href='transito.html'">🚦 Trânsito</button>
        <button onclick="window.location.href='iluminacao.html'">💡 Iluminação</button>
        <button onclick="window.location.href='sustentavel.html'">🏙️ Cidade Sustentável</button>
        <button onclick="iniciarJogo(4)">💧 Água</button>
        <button onclick="iniciarJogo(5)">🌱 Benefícios</button>
    </div>

    <!-- Script principal de Jogos -->
    <script src="games.js"></script>

</body>

</html>
